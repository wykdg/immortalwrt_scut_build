name: mt798x_CI

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  # Last 798x build baseline used by this project (2024-11-25).
  REPO_COMMIT: b5d6e1fe4ef9ce182cc97892f14ceed47cf14a56

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.repository.owner.id == github.event.sender.id
    permissions: write-all
    runs-on: ubuntu-22.04
    env:
      build_variant: ${{ matrix.build_variant }}
      platform: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_variant: mt7981-ax3000
            platform: mt7981
          - build_variant: mt7986-ax4200
            platform: mt7986
          - build_variant: mt7986-ax6000-256m
            platform: mt7986
          - build_variant: mt7986-ax6000
            platform: mt7986

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 1024
          root-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - name: Checkout
        uses: actions/checkout@v4
      - name: Init build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5 libncursesw5-dev libreadline-dev libssl-dev libtool lld lldb lrzsz mkisofs \
            msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h
      - name: Prepare
        run: |
          build_date="$(date +%Y%m%d)"
          image_prefix="immortalwrt-${build_variant}-scutclient"
          echo "image_name=${image_prefix}-${build_date}" >> "$GITHUB_ENV"
          echo "release_tag=immortalwrt-mt798x-scutclient-${build_date}" >> "$GITHUB_ENV"

          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          git fetch --depth=1 origin "$REPO_COMMIT"
          git checkout --detach "$REPO_COMMIT"
          bash ../01_prepare.sh
          cat "defconfig/${build_variant}.config" > .config
          bash ../02_add_package.sh
          make defconfig

          if grep -Eq '^CONFIG_PACKAGE_(luci-app-mosdns|luci-app-openvpn-server|luci-app-passwall_INCLUDE_Xray|xray-core|xray-plugin)=[ym]$' .config; then
            echo 'A removed proxy package is still selected' >&2
            exit 1
          fi
      - name: Make Download
        run: |
          cd openwrt
          make download -j"$(nproc)"
      - name: Compile
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s
      - name: Package
        run: |
          rm -rf ./artifact/
          mkdir -p ./artifact/
          cp openwrt/bin/targets/mediatek/${platform}/immortalwrt-*squashfs* ./artifact/
          cd artifact
          7z a -mx=9 "../${image_name}.7z" .
      - name: Create release
        uses: ncipollo/release-action@v1.12.0
        with:
          name: ${{ env.release_tag }}
          allowUpdates: true
          prerelease: false
          tag: ${{ env.release_tag }}
          commit: ${{ github.sha }}
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.image_name }}.7z
